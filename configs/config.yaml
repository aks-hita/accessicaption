model:
  base_model_id: "llava-hf/llava-1.5-7b-hf"   # swap to paligemma-3b for lighter runs
  torch_dtype: "float16"
  load_in_4bit: true                            # QLoRA — fits on a single T4

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/accessicaption-v1"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8      # effective batch = 32
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 50
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  bf16: false
  fp16: true
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: "accessicaption-llava-qlora-v1"

data:
  train_data_path: "./data/processed/train.json"
  eval_data_path: "./data/processed/eval.json"
  max_seq_length: 512
  image_size: 336                       # LLaVA-1.5 default
  datasets_to_use:
    - coco_captions
    - vizwiz
  vizwiz_weight: 2.0                    # oversample VizWiz (real blind-user images)
  wcag_normalize: true

inference:
  confidence_method: "logit_variance"   # or "mc_dropout"
  mc_dropout_passes: 5                  # used only if mc_dropout selected
  default_confidence_threshold: 0.75
  max_new_tokens: 80
  temperature: 0.2
  do_sample: false
